name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile source
        run: |
          python -m compileall -q main.py src test_data tests scripts

      - name: Run pytest
        run: |
          pytest

      - name: Generate and verify engineering data
        run: |
          python test_data/manage_test_data.py generate
          python test_data/manage_test_data.py verify-all
